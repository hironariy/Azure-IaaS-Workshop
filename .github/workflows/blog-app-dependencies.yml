name: Blog app dependencies

on:
  pull_request:
    paths:
      - ".github/workflows/blog-app-dependencies.yml"
      - "materials/frontend/**"
      - "materials/backend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blog-app-dependencies.yml"
      - "materials/frontend/**"
      - "materials/backend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend dependency audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: materials/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: materials/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Build
        run: npm run build

  backend:
    name: Backend dependency audit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: materials/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: materials/backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Prune development dependencies
        run: npm prune --omit=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
